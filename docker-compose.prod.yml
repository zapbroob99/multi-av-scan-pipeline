# Production deployment for MASP.
#
# Unlike docker-compose.yml (local development), this file:
#   - uses an EXTERNAL, operator-provided PostgreSQL (no bundled postgres
#     service, no hardcoded credentials);
#   - reads every setting from an operator-managed env file, never inline
#     secrets (see .env.production.example);
#   - defaults ICAP to fail-closed and block-on-review;
#   - requires MASP_API_TOKEN and explicit upload/ICAP size limits.
#
# Usage (see docs/deployment/PRODUCTION.md):
#   cp .env.production.example .env.production   # then fill in real values
#   docker compose -f docker-compose.prod.yml --env-file .env.production \
#       --profile icap up -d --build
#
# The 'icap' service only starts with '--profile icap'; omit it for REST-only.

name: masp-prod

x-common-env: &common-env
  MASP_DATABASE_URL: ${MASP_DATABASE_URL:?set MASP_DATABASE_URL to the external PostgreSQL DSN}
  MASP_DB_POOL_ENABLED: ${MASP_DB_POOL_ENABLED:-1}
  MASP_DB_POOL_MIN: ${MASP_DB_POOL_MIN:-0}
  MASP_DB_POOL_MAX: ${MASP_DB_POOL_MAX:-4}
  MASP_DB_POOL_TIMEOUT_SECONDS: ${MASP_DB_POOL_TIMEOUT_SECONDS:-30}
  MASP_CLAMD_HOST: clamav
  MASP_CLAMD_PORT: "3310"
  MASP_CLAMD_TIMEOUT_SECONDS: ${MASP_CLAMD_TIMEOUT_SECONDS:-180}
  MASP_CLAMD_READY_TIMEOUT_SECONDS: ${MASP_CLAMD_READY_TIMEOUT_SECONDS:-30}
  MASP_YARA_RULES_DIR: /app/rules

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${MASP_APP_BIND:-127.0.0.1:8000}:8000"
    environment:
      <<: *common-env
      MASP_API_TOKEN: ${MASP_API_TOKEN:?set MASP_API_TOKEN; the API refuses auth (503) without it}
      MASP_API_MAX_WAIT_SECONDS: ${MASP_API_MAX_WAIT_SECONDS:-30}
      MASP_API_RETRY_AFTER_SECONDS: ${MASP_API_RETRY_AFTER_SECONDS:-2}
      MASP_UPLOAD_MAX_BYTES: ${MASP_UPLOAD_MAX_BYTES:?set MASP_UPLOAD_MAX_BYTES (e.g. 52428800 for 50 MiB)}
    volumes:
      - ${MASP_STORAGE_DIR:-./storage}:/app/storage
      - ${MASP_RULES_DIR:-./rules}:/app/rules
    depends_on:
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build: .
    restart: unless-stopped
    command: python -m app.workers.scan_worker
    environment:
      <<: *common-env
      MASP_WORKER_POLL_SECONDS: ${MASP_WORKER_POLL_SECONDS:-2}
      MASP_WORKER_ENGINE_KEYS: ${MASP_WORKER_ENGINE_KEYS:-static_metadata,clamav,yara}
    volumes:
      - ${MASP_STORAGE_DIR:-./storage}:/app/storage
      - ${MASP_RULES_DIR:-./rules}:/app/rules
    depends_on:
      clamav:
        condition: service_healthy
      # No dependency on app: concurrent fresh-DB bootstrap is serialized by the
      # advisory lock in init_postgres_db, so app and worker start in parallel.

  icap:
    build: .
    restart: unless-stopped
    profiles:
      - icap
    command: python -m app.icap.server
    ports:
      - "${MASP_ICAP_BIND:-127.0.0.1:1344}:1344"
    environment:
      <<: *common-env
      MASP_ICAP_HOST: 0.0.0.0
      MASP_ICAP_PORT: "1344"
      MASP_ICAP_SERVICE_NAME: ${MASP_ICAP_SERVICE_NAME:-masp}
      MASP_ICAP_WAIT_SECONDS: ${MASP_ICAP_WAIT_SECONDS:-30}
      MASP_ICAP_MAX_BYTES: ${MASP_ICAP_MAX_BYTES:?set MASP_ICAP_MAX_BYTES (e.g. 52428800 for 50 MiB)}
      MASP_UPLOAD_MAX_BYTES: ${MASP_UPLOAD_MAX_BYTES:?set MASP_UPLOAD_MAX_BYTES}
      # Security defaults: block on timeout/oversize/error and on review verdicts.
      MASP_ICAP_FAIL_MODE_CLOSED: ${MASP_ICAP_FAIL_MODE_CLOSED:-1}
      MASP_ICAP_BLOCK_ON_REVIEW: ${MASP_ICAP_BLOCK_ON_REVIEW:-1}
      MASP_ICAP_ALLOWED_IPS: ${MASP_ICAP_ALLOWED_IPS:-}
      MASP_ICAP_PREVIEW_BYTES: ${MASP_ICAP_PREVIEW_BYTES:-0}
    volumes:
      - ${MASP_STORAGE_DIR:-./storage}:/app/storage
      - ${MASP_RULES_DIR:-./rules}:/app/rules
    depends_on:
      clamav:
        condition: service_healthy

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    environment:
      CLAMD_CONF_StreamMaxLength: ${MASP_CLAMD_STREAM_MAX_LENGTH:-64M}
      CLAMD_CONF_MaxFileSize: ${MASP_CLAMD_MAX_FILE_SIZE:-64M}
      CLAMD_CONF_MaxScanSize: ${MASP_CLAMD_MAX_SCAN_SIZE:-64M}
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

volumes:
  clamav-db:
