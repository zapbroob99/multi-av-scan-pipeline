name: Browser contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-browser-contracts.txt
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend/tools/contracts ci --ignore-scripts
      - run: npm --prefix frontend run contracts:check
      - run: npm --prefix frontend run contracts:test
      - run: python -W ignore::ResourceWarning -m unittest discover -s tests -p test_browser_contracts.py
      - run: python -W ignore::ResourceWarning -m unittest discover -s tests -p test_ui_api.py
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build

  postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
        env:
          POSTGRES_USER: masp_test
          POSTGRES_PASSWORD: masp_test_password
          POSTGRES_DB: masp_browser_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U masp_test -d masp_browser_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MASP_TEST_POSTGRES_URL: postgresql://masp_test:masp_test_password@127.0.0.1:5432/masp_browser_acceptance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-browser-contracts.txt
      - run: python -W ignore::ResourceWarning -m unittest discover -s tests
