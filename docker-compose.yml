name: masp

services:
  app:
    build: .
    ports:
      # Loopback-only: this dev stack ships known credentials and login hints.
      - "127.0.0.1:8000:8000"
    environment:
      MASP_DATABASE_URL: postgresql://masp:masp_dev_password@postgres:5432/masp
      MASP_CLAMD_HOST: clamav
      MASP_CLAMD_PORT: "3310"
      MASP_CLAMD_TIMEOUT_SECONDS: "180"
      MASP_CLAMD_READY_TIMEOUT_SECONDS: "30"
      MASP_SCAN_PARTIAL_RESULTS_MAX_WAIT_SECONDS: ${MASP_SCAN_PARTIAL_RESULTS_MAX_WAIT_SECONDS:-120}
      MASP_YARA_RULES_DIR: /app/rules
      MASP_API_TOKEN: ${MASP_API_TOKEN:-change-me}
      MASP_SECRET_ENCRYPTION_KEY: ${MASP_SECRET_ENCRYPTION_KEY:-}
      MASP_WORKER_ENROLLMENT_TOKEN: ${MASP_WORKER_ENROLLMENT_TOKEN:-}
      MASP_WORKER_AGENT_TOKEN_TTL_DAYS: ${MASP_WORKER_AGENT_TOKEN_TTL_DAYS:-}
      MASP_WORKER_CONTROL_REQUIRE_HTTPS: ${MASP_WORKER_CONTROL_REQUIRE_HTTPS:-0}
      # Local development convenience only. The application has no built-in
      # default password; production/pilot must supply a strong secret and keep
      # MASP_SHOW_DEV_LOGIN_HINTS off.
      MASP_ADMIN_PASSWORD: ${MASP_ADMIN_PASSWORD:-admin123!}
      MASP_SHOW_DEV_LOGIN_HINTS: ${MASP_SHOW_DEV_LOGIN_HINTS:-1}
      MASP_API_MAX_WAIT_SECONDS: ${MASP_API_MAX_WAIT_SECONDS:-15}
      MASP_API_RETRY_AFTER_SECONDS: ${MASP_API_RETRY_AFTER_SECONDS:-2}
      MASP_UPLOAD_MAX_BYTES: ${MASP_UPLOAD_MAX_BYTES:-0}
      # Optional LDAP/Active Directory login. Only the app receives directory
      # credentials; workers and ICAP never need them.
      MASP_LDAP_ENABLED: ${MASP_LDAP_ENABLED:-0}
      MASP_LDAP_HOST: ${MASP_LDAP_HOST:-}
      MASP_LDAP_PORT: ${MASP_LDAP_PORT:-636}
      MASP_LDAP_TLS_MODE: ${MASP_LDAP_TLS_MODE:-ldaps}
      MASP_LDAP_CA_CERT_FILE: ${MASP_LDAP_CA_CERT_FILE:-}
      MASP_LDAP_CONNECT_TIMEOUT: ${MASP_LDAP_CONNECT_TIMEOUT:-5}
      MASP_LDAP_RECEIVE_TIMEOUT: ${MASP_LDAP_RECEIVE_TIMEOUT:-8}
      MASP_LDAP_BIND_DN: ${MASP_LDAP_BIND_DN:-}
      MASP_LDAP_BIND_PASSWORD: ${MASP_LDAP_BIND_PASSWORD:-}
      MASP_LDAP_BASE_DN: ${MASP_LDAP_BASE_DN:-}
      MASP_LDAP_USER_FILTER: ${MASP_LDAP_USER_FILTER:-}
      MASP_LDAP_USERNAME_ATTRIBUTE: ${MASP_LDAP_USERNAME_ATTRIBUTE:-sAMAccountName}
      MASP_LDAP_DISPLAY_NAME_ATTRIBUTE: ${MASP_LDAP_DISPLAY_NAME_ATTRIBUTE:-displayName}
      MASP_LDAP_GROUP_ATTRIBUTE: ${MASP_LDAP_GROUP_ATTRIBUTE:-memberOf}
      MASP_LDAP_ADMIN_GROUP_DN: ${MASP_LDAP_ADMIN_GROUP_DN:-}
      MASP_LDAP_ANALYST_GROUP_DN: ${MASP_LDAP_ANALYST_GROUP_DN:-}

      MASP_VIRUSTOTAL_ENABLED: ${MASP_VIRUSTOTAL_ENABLED:-0}
      MASP_VIRUSTOTAL_API_KEY: ${MASP_VIRUSTOTAL_API_KEY:-}
      MASP_VIRUSTOTAL_TIMEOUT_SECONDS: ${MASP_VIRUSTOTAL_TIMEOUT_SECONDS:-10}
      MASP_VIRUSTOTAL_CACHE_SECONDS: ${MASP_VIRUSTOTAL_CACHE_SECONDS:-3600}
      MASP_VIRUSTOTAL_UNKNOWN_CACHE_SECONDS: ${MASP_VIRUSTOTAL_UNKNOWN_CACHE_SECONDS:-300}
      MASP_VIRUSTOTAL_CACHE_MAX_ENTRIES: ${MASP_VIRUSTOTAL_CACHE_MAX_ENTRIES:-10000}
      MASP_VIRUSTOTAL_MALICIOUS_THRESHOLD: ${MASP_VIRUSTOTAL_MALICIOUS_THRESHOLD:-1}
      MASP_VIRUSTOTAL_ALLOW_UNDETECTED: ${MASP_VIRUSTOTAL_ALLOW_UNDETECTED:-0}
      MASP_VIRUSTOTAL_MAX_AGE_DAYS: ${MASP_VIRUSTOTAL_MAX_AGE_DAYS:-30}
    volumes:
      - ./storage:/app/storage
      - ./rules:/app/rules
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_started

  icap:
    build: .
    profiles:
      - icap
    command: python -m app.icap.server
    ports:
      - "127.0.0.1:1344:1344"
    environment:
      MASP_DATABASE_URL: postgresql://masp:masp_dev_password@postgres:5432/masp
      MASP_ICAP_HOST: 0.0.0.0
      MASP_ICAP_PORT: "1344"
      MASP_ICAP_SERVICE_NAME: ${MASP_ICAP_SERVICE_NAME:-masp}
      MASP_ICAP_WAIT_SECONDS: ${MASP_ICAP_WAIT_SECONDS:-30}
      MASP_ICAP_MAX_BYTES: ${MASP_ICAP_MAX_BYTES:-0}
      MASP_UPLOAD_MAX_BYTES: ${MASP_UPLOAD_MAX_BYTES:-0}
      MASP_ICAP_FAIL_MODE_CLOSED: ${MASP_ICAP_FAIL_MODE_CLOSED:-1}
      MASP_ICAP_BLOCK_ON_REVIEW: ${MASP_ICAP_BLOCK_ON_REVIEW:-0}
      MASP_ICAP_ALLOWED_IPS: ${MASP_ICAP_ALLOWED_IPS:-}
    volumes:
      - ./storage:/app/storage
      - ./rules:/app/rules
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    profiles:
      - linux-worker
    command: python -m app.workers.scan_worker
    environment:
      MASP_DATABASE_URL: postgresql://masp:masp_dev_password@postgres:5432/masp
      MASP_CLAMD_HOST: clamav
      MASP_CLAMD_PORT: "3310"
      MASP_CLAMD_TIMEOUT_SECONDS: "180"
      MASP_CLAMD_READY_TIMEOUT_SECONDS: "30"
      MASP_SCAN_PARTIAL_RESULTS_MAX_WAIT_SECONDS: ${MASP_SCAN_PARTIAL_RESULTS_MAX_WAIT_SECONDS:-120}
      MASP_YARA_RULES_DIR: /app/rules
      # Decrypts the UI-managed VirusTotal key. This worker sends only the
      # precomputed SHA-256 and never uploads file content to VirusTotal.
      MASP_SECRET_ENCRYPTION_KEY: ${MASP_SECRET_ENCRYPTION_KEY:-}
      MASP_VIRUSTOTAL_API_KEY: ${MASP_VIRUSTOTAL_API_KEY:-}
      MASP_WORKER_POLL_SECONDS: "2"
      MASP_WORKER_TIMING_EVENTS_ENABLED: ${MASP_WORKER_TIMING_EVENTS_ENABLED:-1}
      MASP_WORKER_ENGINE_KEYS: static_metadata,clamav,yara,virustotal
      MASP_WORKER_NODE_ID: dev-linux-combined
      MASP_WORKER_NODE_NAME: Dev Linux Combined Worker
      MASP_WORKER_LABELS: site=local,profile=combined,os=linux
      MASP_WORKER_CAPACITY: "1"
      MASP_WORKER_HEALTH_INTERVAL_SECONDS: ${MASP_WORKER_HEALTH_INTERVAL_SECONDS:-60}
      MASP_WORKER_HEALTH_LEASE_SECONDS: ${MASP_WORKER_HEALTH_LEASE_SECONDS:-1200}
      MASP_WORKER_HEALTH_CHECKS_PER_TICK: ${MASP_WORKER_HEALTH_CHECKS_PER_TICK:-2}
      MASP_ENGINE_JOB_QUEUE_ENABLED: ${MASP_ENGINE_JOB_QUEUE_ENABLED:-1}
      MASP_ENGINE_JOB_LEASE_SECONDS: ${MASP_ENGINE_JOB_LEASE_SECONDS:-120}
      MASP_LEGACY_SCAN_WORKER_FALLBACK_ENABLED: ${MASP_LEGACY_SCAN_WORKER_FALLBACK_ENABLED:-0}
    volumes:
      - ./storage:/app/storage
      - ./rules:/app/rules
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_started

  worker-static:
    build: .
    profiles:
      - linux-worker-split
    command: python -m app.workers.scan_worker
    environment:
      MASP_DATABASE_URL: postgresql://masp:masp_dev_password@postgres:5432/masp
      MASP_CLAMD_HOST: clamav
      MASP_CLAMD_PORT: "3310"
      MASP_CLAMD_TIMEOUT_SECONDS: "180"
      MASP_CLAMD_READY_TIMEOUT_SECONDS: "30"
      MASP_SCAN_PARTIAL_RESULTS_MAX_WAIT_SECONDS: ${MASP_SCAN_PARTIAL_RESULTS_MAX_WAIT_SECONDS:-120}
      MASP_YARA_RULES_DIR: /app/rules
      MASP_SECRET_ENCRYPTION_KEY: ${MASP_SECRET_ENCRYPTION_KEY:-}
      MASP_VIRUSTOTAL_API_KEY: ${MASP_VIRUSTOTAL_API_KEY:-}
      MASP_WORKER_POLL_SECONDS: "2"
      MASP_WORKER_TIMING_EVENTS_ENABLED: ${MASP_WORKER_TIMING_EVENTS_ENABLED:-1}
      MASP_WORKER_ENGINE_KEYS: static_metadata,virustotal
      MASP_WORKER_NODE_ID: dev-static-worker
      MASP_WORKER_NODE_NAME: Dev Static Worker
      MASP_WORKER_LABELS: site=local,profile=split,os=linux
      MASP_WORKER_CAPACITY: "1"
      MASP_WORKER_HEALTH_INTERVAL_SECONDS: ${MASP_WORKER_HEALTH_INTERVAL_SECONDS:-60}
      MASP_WORKER_HEALTH_LEASE_SECONDS: ${MASP_WORKER_HEALTH_LEASE_SECONDS:-1200}
      MASP_WORKER_HEALTH_CHECKS_PER_TICK: ${MASP_WORKER_HEALTH_CHECKS_PER_TICK:-2}
      MASP_ENGINE_JOB_QUEUE_ENABLED: ${MASP_ENGINE_JOB_QUEUE_ENABLED:-1}
      MASP_ENGINE_JOB_LEASE_SECONDS: ${MASP_ENGINE_JOB_LEASE_SECONDS:-120}
      MASP_LEGACY_SCAN_WORKER_FALLBACK_ENABLED: ${MASP_LEGACY_SCAN_WORKER_FALLBACK_ENABLED:-0}
    volumes:
      - ./storage:/app/storage
      - ./rules:/app/rules
    depends_on:
      postgres:
        condition: service_healthy

  worker-clamav:
    build: .
    profiles:
      - linux-worker-split
    command: python -m app.workers.scan_worker
    environment:
      MASP_DATABASE_URL: postgresql://masp:masp_dev_password@postgres:5432/masp
      MASP_CLAMD_HOST: clamav
      MASP_CLAMD_PORT: "3310"
      MASP_CLAMD_TIMEOUT_SECONDS: "180"
      MASP_CLAMD_READY_TIMEOUT_SECONDS: "30"
      MASP_SCAN_PARTIAL_RESULTS_MAX_WAIT_SECONDS: ${MASP_SCAN_PARTIAL_RESULTS_MAX_WAIT_SECONDS:-120}
      MASP_YARA_RULES_DIR: /app/rules
      MASP_WORKER_POLL_SECONDS: "2"
      MASP_WORKER_TIMING_EVENTS_ENABLED: ${MASP_WORKER_TIMING_EVENTS_ENABLED:-1}
      MASP_WORKER_ENGINE_KEYS: clamav
      MASP_WORKER_NODE_ID: dev-clamav-worker
      MASP_WORKER_NODE_NAME: Dev ClamAV Worker
      MASP_WORKER_LABELS: site=local,profile=split,os=linux
      MASP_WORKER_CAPACITY: "1"
      MASP_WORKER_HEALTH_INTERVAL_SECONDS: ${MASP_WORKER_HEALTH_INTERVAL_SECONDS:-60}
      MASP_WORKER_HEALTH_LEASE_SECONDS: ${MASP_WORKER_HEALTH_LEASE_SECONDS:-1200}
      MASP_WORKER_HEALTH_CHECKS_PER_TICK: ${MASP_WORKER_HEALTH_CHECKS_PER_TICK:-2}
      MASP_ENGINE_JOB_QUEUE_ENABLED: ${MASP_ENGINE_JOB_QUEUE_ENABLED:-1}
      MASP_ENGINE_JOB_LEASE_SECONDS: ${MASP_ENGINE_JOB_LEASE_SECONDS:-120}
      MASP_LEGACY_SCAN_WORKER_FALLBACK_ENABLED: ${MASP_LEGACY_SCAN_WORKER_FALLBACK_ENABLED:-0}
    volumes:
      - ./storage:/app/storage
      - ./rules:/app/rules
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_started

  worker-yara:
    build: .
    profiles:
      - linux-worker-split
    command: python -m app.workers.scan_worker
    environment:
      MASP_DATABASE_URL: postgresql://masp:masp_dev_password@postgres:5432/masp
      MASP_CLAMD_HOST: clamav
      MASP_CLAMD_PORT: "3310"
      MASP_CLAMD_TIMEOUT_SECONDS: "180"
      MASP_CLAMD_READY_TIMEOUT_SECONDS: "30"
      MASP_SCAN_PARTIAL_RESULTS_MAX_WAIT_SECONDS: ${MASP_SCAN_PARTIAL_RESULTS_MAX_WAIT_SECONDS:-120}
      MASP_YARA_RULES_DIR: /app/rules
      MASP_WORKER_POLL_SECONDS: "2"
      MASP_WORKER_TIMING_EVENTS_ENABLED: ${MASP_WORKER_TIMING_EVENTS_ENABLED:-1}
      MASP_WORKER_ENGINE_KEYS: yara
      MASP_WORKER_NODE_ID: dev-yara-worker
      MASP_WORKER_NODE_NAME: Dev YARA Worker
      MASP_WORKER_LABELS: site=local,profile=split,os=linux
      MASP_WORKER_CAPACITY: "1"
      MASP_WORKER_HEALTH_INTERVAL_SECONDS: ${MASP_WORKER_HEALTH_INTERVAL_SECONDS:-60}
      MASP_WORKER_HEALTH_LEASE_SECONDS: ${MASP_WORKER_HEALTH_LEASE_SECONDS:-1200}
      MASP_WORKER_HEALTH_CHECKS_PER_TICK: ${MASP_WORKER_HEALTH_CHECKS_PER_TICK:-2}
      MASP_ENGINE_JOB_QUEUE_ENABLED: ${MASP_ENGINE_JOB_QUEUE_ENABLED:-1}
      MASP_ENGINE_JOB_LEASE_SECONDS: ${MASP_ENGINE_JOB_LEASE_SECONDS:-120}
      MASP_LEGACY_SCAN_WORKER_FALLBACK_ENABLED: ${MASP_LEGACY_SCAN_WORKER_FALLBACK_ENABLED:-0}
    volumes:
      - ./storage:/app/storage
      - ./rules:/app/rules
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: masp
      POSTGRES_USER: masp
      POSTGRES_PASSWORD: masp_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masp -d masp"]
      interval: 5s
      timeout: 3s
      retries: 20

  clamav:
    image: clamav/clamav:stable
    environment:
      CLAMD_CONF_StreamMaxLength: 512M
      CLAMD_CONF_MaxFileSize: 512M
      CLAMD_CONF_MaxScanSize: 512M
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav-db:/var/lib/clamav

volumes:
  postgres-data:
  clamav-db:
