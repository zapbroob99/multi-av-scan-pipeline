name: masp

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      MASP_CLAMD_HOST: clamav
      MASP_CLAMD_PORT: "3310"
      MASP_CLAMD_TIMEOUT_SECONDS: "60"
      MASP_YARA_RULES_DIR: /app/rules
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
      - ./rules:/app/rules
    depends_on:
      - clamav

  worker:
    build: .
    profiles:
      - linux-worker
    command: python -m app.workers.scan_worker
    environment:
      MASP_CLAMD_HOST: clamav
      MASP_CLAMD_PORT: "3310"
      MASP_CLAMD_TIMEOUT_SECONDS: "60"
      MASP_YARA_RULES_DIR: /app/rules
      MASP_WORKER_POLL_SECONDS: "2"
      MASP_WORKER_ENGINE_KEYS: static_metadata,clamav,yara
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
      - ./rules:/app/rules
    depends_on:
      - clamav

  clamav:
    image: clamav/clamav:stable
    ports:
      - "3310:3310"
    volumes:
      - clamav-db:/var/lib/clamav

volumes:
  clamav-db:
