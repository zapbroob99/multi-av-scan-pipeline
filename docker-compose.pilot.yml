# Single-host MASP pilot: API, ICAP, workers, ClamAV, and PostgreSQL.
#
# This compose file is intentionally separate from local development and the
# external-database production topology. Configure it with .env.pilot; never
# expose PostgreSQL outside the compose network.

name: masp-pilot

x-masp-service: &masp-service
  image: ${MASP_IMAGE:-masp-pilot:local}
  build:
    context: .
  restart: unless-stopped
  # These three services parse untrusted samples in-process, so they are the
  # blast radius of any archive/format parser exploit. Confine them:
  #   user            unprivileged fixed id, matching the Dockerfile and the
  #                   host storage directory ownership set by install.sh
  #   cap_drop ALL    no Linux capabilities are needed (ports are >1024)
  #   no-new-privs    a setuid binary can never raise privileges
  #   read_only       the image filesystem is immutable at runtime; the only
  #                   writable paths are the storage/rules bind mounts and /tmp
  user: "10001:10001"
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp
  logging:
    driver: json-file
    options:
      max-size: ${MASP_LOG_MAX_SIZE:-20m}
      max-file: ${MASP_LOG_MAX_FILES:-5}

x-common-env: &common-env
  MASP_DATABASE_URL: postgresql://masp:${MASP_POSTGRES_PASSWORD:?set MASP_POSTGRES_PASSWORD}@postgres:5432/masp
  MASP_DB_POOL_ENABLED: ${MASP_DB_POOL_ENABLED:-1}
  MASP_DB_POOL_MIN: ${MASP_DB_POOL_MIN:-0}
  MASP_DB_POOL_MAX: ${MASP_DB_POOL_MAX:-4}
  MASP_DB_POOL_TIMEOUT_SECONDS: ${MASP_DB_POOL_TIMEOUT_SECONDS:-30}
  MASP_CLAMD_HOST: clamav
  MASP_CLAMD_PORT: "3310"
  MASP_CLAMD_TIMEOUT_SECONDS: ${MASP_CLAMD_TIMEOUT_SECONDS:-180}
  # Mirror of the caps configured on the clamav service below. The app and
  # worker need them to decide, BEFORE streaming, that a sample exceeds what
  # clamd will accept -- otherwise the sample is sent and rejected there, and a
  # deliberate skip looks like an engine failure. Keep these in sync with the
  # CLAMD_CONF_* values.
  MASP_CLAMD_STREAM_MAX_LENGTH: ${MASP_CLAMD_STREAM_MAX_LENGTH:-64M}
  MASP_CLAMD_MAX_FILE_SIZE: ${MASP_CLAMD_MAX_FILE_SIZE:-64M}
  MASP_CLAMD_READY_TIMEOUT_SECONDS: ${MASP_CLAMD_READY_TIMEOUT_SECONDS:-30}
  MASP_SCAN_PARTIAL_RESULTS_MAX_WAIT_SECONDS: ${MASP_SCAN_PARTIAL_RESULTS_MAX_WAIT_SECONDS:-120}
  MASP_YARA_RULES_DIR: /app/rules

services:
  app:
    <<: *masp-service
    ports:
      - "${MASP_APP_BIND:?set MASP_APP_BIND}:8000"
    environment:
      <<: *common-env
      MASP_API_TOKEN: ${MASP_API_TOKEN:?set MASP_API_TOKEN}
      MASP_SECRET_ENCRYPTION_KEY: ${MASP_SECRET_ENCRYPTION_KEY:-}
      MASP_WORKER_ENROLLMENT_TOKEN: ${MASP_WORKER_ENROLLMENT_TOKEN:-}
      MASP_WORKER_AGENT_TOKEN_TTL_DAYS: ${MASP_WORKER_AGENT_TOKEN_TTL_DAYS:-90}
      MASP_WORKER_CONTROL_REQUIRE_HTTPS: ${MASP_WORKER_CONTROL_REQUIRE_HTTPS:-1}
      MASP_ADMIN_PASSWORD: ${MASP_ADMIN_PASSWORD:?set MASP_ADMIN_PASSWORD}
      MASP_SHOW_DEV_LOGIN_HINTS: "0"
      MASP_API_MAX_WAIT_SECONDS: ${MASP_API_MAX_WAIT_SECONDS:-30}
      MASP_API_RETRY_AFTER_SECONDS: ${MASP_API_RETRY_AFTER_SECONDS:-2}
      MASP_UPLOAD_MAX_BYTES: ${MASP_UPLOAD_MAX_BYTES:?set MASP_UPLOAD_MAX_BYTES}
      # Optional LDAP/Active Directory login. Only the app receives directory
      # credentials; workers and ICAP never need them.
      MASP_LDAP_ENABLED: ${MASP_LDAP_ENABLED:-0}
      MASP_LDAP_HOST: ${MASP_LDAP_HOST:-}
      MASP_LDAP_PORT: ${MASP_LDAP_PORT:-636}
      MASP_LDAP_TLS_MODE: ${MASP_LDAP_TLS_MODE:-ldaps}
      MASP_LDAP_CA_CERT_FILE: ${MASP_LDAP_CA_CERT_FILE:-}
      MASP_LDAP_CONNECT_TIMEOUT: ${MASP_LDAP_CONNECT_TIMEOUT:-5}
      MASP_LDAP_RECEIVE_TIMEOUT: ${MASP_LDAP_RECEIVE_TIMEOUT:-8}
      MASP_LDAP_BIND_DN: ${MASP_LDAP_BIND_DN:-}
      MASP_LDAP_BIND_PASSWORD: ${MASP_LDAP_BIND_PASSWORD:-}
      MASP_LDAP_BASE_DN: ${MASP_LDAP_BASE_DN:-}
      MASP_LDAP_USER_FILTER: ${MASP_LDAP_USER_FILTER:-}
      MASP_LDAP_USERNAME_ATTRIBUTE: ${MASP_LDAP_USERNAME_ATTRIBUTE:-sAMAccountName}
      MASP_LDAP_DISPLAY_NAME_ATTRIBUTE: ${MASP_LDAP_DISPLAY_NAME_ATTRIBUTE:-displayName}
      MASP_LDAP_GROUP_ATTRIBUTE: ${MASP_LDAP_GROUP_ATTRIBUTE:-memberOf}
      MASP_LDAP_ADMIN_GROUP_DN: ${MASP_LDAP_ADMIN_GROUP_DN:-}
      MASP_LDAP_ANALYST_GROUP_DN: ${MASP_LDAP_ANALYST_GROUP_DN:-}

      # Hash reputation. The endpoint and file-scan worker send only SHA-256;
      # no MASP component uploads file content to VirusTotal.
      MASP_VIRUSTOTAL_ENABLED: ${MASP_VIRUSTOTAL_ENABLED:-0}
      MASP_VIRUSTOTAL_API_KEY: ${MASP_VIRUSTOTAL_API_KEY:-}
      MASP_VIRUSTOTAL_TIMEOUT_SECONDS: ${MASP_VIRUSTOTAL_TIMEOUT_SECONDS:-10}
      MASP_VIRUSTOTAL_CACHE_SECONDS: ${MASP_VIRUSTOTAL_CACHE_SECONDS:-3600}
      MASP_VIRUSTOTAL_UNKNOWN_CACHE_SECONDS: ${MASP_VIRUSTOTAL_UNKNOWN_CACHE_SECONDS:-300}
      MASP_VIRUSTOTAL_CACHE_MAX_ENTRIES: ${MASP_VIRUSTOTAL_CACHE_MAX_ENTRIES:-10000}
      MASP_VIRUSTOTAL_MALICIOUS_THRESHOLD: ${MASP_VIRUSTOTAL_MALICIOUS_THRESHOLD:-1}
      MASP_VIRUSTOTAL_ALLOW_UNDETECTED: ${MASP_VIRUSTOTAL_ALLOW_UNDETECTED:-0}
      MASP_VIRUSTOTAL_MAX_AGE_DAYS: ${MASP_VIRUSTOTAL_MAX_AGE_DAYS:-30}
    volumes:
      - ${MASP_STORAGE_DIR:?set MASP_STORAGE_DIR}:/app/storage
      - ${MASP_RULES_DIR:-./rules}:/app/rules
      - ./tools:/app/tools:ro
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 12

  worker:
    <<: *masp-service
    command: python -m app.workers.scan_worker
    environment:
      <<: *common-env
      MASP_SECRET_ENCRYPTION_KEY: ${MASP_SECRET_ENCRYPTION_KEY:-}
      MASP_VIRUSTOTAL_API_KEY: ${MASP_VIRUSTOTAL_API_KEY:-}
      MASP_WORKER_POLL_SECONDS: ${MASP_WORKER_POLL_SECONDS:-2}
      MASP_WORKER_TIMING_EVENTS_ENABLED: ${MASP_WORKER_TIMING_EVENTS_ENABLED:-1}
      MASP_WORKER_ENGINE_KEYS: ${MASP_WORKER_ENGINE_KEYS:-static_metadata,clamav,yara,virustotal}
      MASP_WORKER_NODE_ID: ${MASP_WORKER_NODE_ID:-pilot-linux-worker}
      MASP_WORKER_NODE_NAME: ${MASP_WORKER_NODE_NAME:-Pilot Linux Worker}
      MASP_WORKER_AGENT_VERSION: ${MASP_WORKER_AGENT_VERSION:-0.1.0}
      MASP_WORKER_LABELS: ${MASP_WORKER_LABELS:-site=pilot,os=linux}
      MASP_WORKER_CAPACITY: ${MASP_WORKER_CAPACITY:-1}
      MASP_WORKER_HEALTH_INTERVAL_SECONDS: ${MASP_WORKER_HEALTH_INTERVAL_SECONDS:-60}
      MASP_WORKER_HEALTH_LEASE_SECONDS: ${MASP_WORKER_HEALTH_LEASE_SECONDS:-1200}
      MASP_WORKER_HEALTH_CHECKS_PER_TICK: ${MASP_WORKER_HEALTH_CHECKS_PER_TICK:-2}
      MASP_ENGINE_JOB_QUEUE_ENABLED: "1"
      MASP_ENGINE_JOB_LEASE_SECONDS: ${MASP_ENGINE_JOB_LEASE_SECONDS:-120}
      MASP_LEGACY_SCAN_WORKER_FALLBACK_ENABLED: "0"
    volumes:
      - ${MASP_STORAGE_DIR:?set MASP_STORAGE_DIR}:/app/storage
      - ${MASP_RULES_DIR:-./rules}:/app/rules
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy

  icap:
    <<: *masp-service
    command: python -m app.icap.server
    ports:
      - "${MASP_ICAP_BIND:?set MASP_ICAP_BIND}:1344"
    environment:
      <<: *common-env
      MASP_ICAP_HOST: 0.0.0.0
      MASP_ICAP_PORT: "1344"
      MASP_ICAP_SERVICE_NAME: ${MASP_ICAP_SERVICE_NAME:-masp}
      MASP_ICAP_SERVICE_CLIENT_KEY: ${MASP_ICAP_SERVICE_CLIENT_KEY:-legacy-default}
      MASP_ICAP_WAIT_SECONDS: ${MASP_ICAP_WAIT_SECONDS:-30}
      MASP_ICAP_MAX_BYTES: ${MASP_ICAP_MAX_BYTES:?set MASP_ICAP_MAX_BYTES}
      MASP_UPLOAD_MAX_BYTES: ${MASP_UPLOAD_MAX_BYTES:?set MASP_UPLOAD_MAX_BYTES}
      MASP_ICAP_FAIL_MODE_CLOSED: "1"
      MASP_ICAP_BLOCK_ON_REVIEW: "1"
      MASP_ICAP_BLOCK_ARCHIVES: "1"
      MASP_ICAP_ALLOWED_IPS: ${MASP_ICAP_ALLOWED_IPS:?set MASP_ICAP_ALLOWED_IPS}
      MASP_ICAP_PREVIEW_BYTES: ${MASP_ICAP_PREVIEW_BYTES:-0}
      MASP_ICAP_READ_TIMEOUT_SECONDS: ${MASP_ICAP_READ_TIMEOUT_SECONDS:-60}
      MASP_ICAP_BODY_TIMEOUT_SECONDS: ${MASP_ICAP_BODY_TIMEOUT_SECONDS:-300}
      # Bounds concurrent scans (each buffers up to the ICAP size cap in RAM).
      # Kept low for the single-worker pilot; raise with worker capacity.
      MASP_ICAP_MAX_CONNECTIONS: ${MASP_ICAP_MAX_CONNECTIONS:-8}
      MASP_ICAP_ADMISSION_TIMEOUT_SECONDS: ${MASP_ICAP_ADMISSION_TIMEOUT_SECONDS:-10}
    volumes:
      - ${MASP_STORAGE_DIR:?set MASP_STORAGE_DIR}:/app/storage
      - ${MASP_RULES_DIR:-./rules}:/app/rules
      - ./tools:/app/tools:ro
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy

  postgres:
    image: ${MASP_POSTGRES_IMAGE:-postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb}
    restart: unless-stopped
    # Upstream images manage their own runtime user and need writable /var/run
    # and /tmp, so they get the privilege-escalation block but not read_only or
    # cap_drop.
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: masp
      POSTGRES_USER: masp
      POSTGRES_PASSWORD: ${MASP_POSTGRES_PASSWORD:?set MASP_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masp -d masp"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: ${MASP_LOG_MAX_SIZE:-20m}
        max-file: ${MASP_LOG_MAX_FILES:-5}

  clamav:
    image: ${MASP_CLAMAV_IMAGE:-clamav/clamav:stable@sha256:1b6443c4a7b456baa1abfaf9796815f8d21e2fb558dbaed5b682fd4552d8b0c3}
    restart: unless-stopped
    # Samples reach clamd by TCP stream, not through a shared mount, so this
    # container never sees the storage directory. See the postgres note above.
    security_opt:
      - no-new-privileges:true
    environment:
      CLAMD_CONF_StreamMaxLength: ${MASP_CLAMD_STREAM_MAX_LENGTH:-64M}
      CLAMD_CONF_MaxFileSize: ${MASP_CLAMD_MAX_FILE_SIZE:-64M}
      CLAMD_CONF_MaxScanSize: ${MASP_CLAMD_MAX_SCAN_SIZE:-64M}
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: ${MASP_LOG_MAX_SIZE:-20m}
        max-file: ${MASP_LOG_MAX_FILES:-5}

volumes:
  postgres-data:
  clamav-db:
